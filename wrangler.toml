# Cloudflare Pages configuration for the GuardianMesh command center.
#
# The deployable artifact is frontend/ — static HTML, CSS and ES modules with
# no build step and no dependencies. Nothing in this repository needs to be
# compiled or installed to serve it.
#
# Python requirements deliberately live in requirements/ rather than the
# repository root: Cloudflare installs any dependency manifest it finds in the
# build root, which made every deploy of this static page try to install the
# CV/ML stack (opencv, mediapipe, torch) and fail. The pin cannot simply be
# raised — every mediapipe release after 0.10.8 removes the `mp.solutions` API
# that ai_cv/pose_tracker.py uses.

name = "guardianmesh"
pages_build_output_dir = "frontend"
