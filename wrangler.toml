name = "guardianmesh"
main = "worker.js"
compatibility_date = "2026-09-12"

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/ws/*"]

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[migrations]]
tag = "v1-leaderboard"
new_sqlite_classes = ["Leaderboard"]
