# Cloudflare configuration for the GuardianMesh command center.
#
# frontend/ is served as static assets (HTML, CSS and ES modules, no build
# step); the browser fetches the pinned MediaPipe runtime/model itself.
# worker.js runs first only for /api/*, /health and /ws/*: edge endpoints for
# nearby help, scoring, cameras and the rescue leaderboard, optionally proxied
# to a hosted FastAPI backend via the BACKEND_ORIGIN variable.
#
# This is deliberately a Workers Static Assets config rather than a Pages one.
# The deploy command configured for this project is `npx wrangler deploy`, which
# is the Workers command; a `pages_build_output_dir` key here would make wrangler
# treat the project as Pages and warn that `wrangler pages deploy` should have
# been used instead. Pages cannot run worker.js's Durable Object, so the
# leaderboard and edge APIs require Workers.
#
# Python requirements live in requirements/ rather than the repository root:
# Cloudflare installs any dependency manifest it finds in the build root, which
# made every deploy of this static page try to install the CV/ML stack (opencv,
# mediapipe, torch) and fail. The pin cannot simply be raised — every mediapipe
# release after 0.10.8 removes the `mp.solutions` API ai_cv/pose_tracker.py uses.

name = "guardianmesh"
main = "worker.js"
compatibility_date = "2026-09-12"

[assets]
directory = "./frontend"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health", "/ws/*"]
# not_found_handling is left at the default (404 for unknown paths) on purpose.
# SPA fallback would serve index.html for a mistyped /js/*.js, so a broken
# module would surface as a confusing syntax error instead of an honest 404.

[[durable_objects.bindings]]
name = "LEADERBOARD"
class_name = "Leaderboard"

[[migrations]]
tag = "v1-leaderboard"
new_sqlite_classes = ["Leaderboard"]
